<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>视频切割工具</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --panel: #1a1d27;
      --border: #2d3148;
      --accent: #4f46e5;
      --accent2: #6366f1;
      --green: #10b981;
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #e5e7eb;
      --text2: #9ca3af;
      --r: 8px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 顶栏 ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .topbar h1 { font-size: 15px; font-weight: 600; }
    .topbar .sep { flex: 1; }
    .btn {
      padding: 6px 14px;
      border-radius: var(--r);
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-green  { background: var(--green);  color: #fff; }
    .btn-red    { background: var(--red);    color: #fff; }
    .btn-ghost  { background: #2d3148; color: var(--text); }

    /* ── 主区域 ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── 左：播放器区 ── */
    .player-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .video-wrap {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      display: block;
      outline: none;
    }
    .drop-hint {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text2);
      pointer-events: none;
    }
    .drop-hint svg { opacity: .4; }
    .drop-hint p { font-size: 14px; }

    /* ── 时间轴区域 ── */
    .timeline-area {
      flex-shrink: 0;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
    }

    /* 进度条 */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .time-label {
      font-size: 12px;
      color: var(--text2);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      min-width: 96px;
    }
    .progress-wrap {
      position: relative;
      flex: 1;
      height: 6px;
      background: #2d3148;
      border-radius: 3px;
      cursor: pointer;
    }
    .progress-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: var(--accent2);
      border-radius: 3px;
      pointer-events: none;
    }
    /* 标记针 */
    .marker-pin {
      position: absolute;
      top: -5px;
      width: 2px;
      height: 16px;
      background: var(--yellow);
      border-radius: 1px;
      transform: translateX(-50%);
      pointer-events: none;
    }
    /* 拖动把手 */
    .progress-thumb {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 1px 4px rgba(0,0,0,.4);
    }

    /* 控制栏 */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .controls-row .btn { padding: 5px 12px; font-size: 12px; }
    .speed-select {
      background: #2d3148;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .kbd-hint {
      font-size: 11px;
      color: var(--text2);
      margin-left: auto;
    }
    kbd {
      background: #2d3148;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 11px;
    }

    /* ── 右：标记列表 ── */
    .sidebar {
      width: 280px;
      border-left: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-head {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .sidebar-head h2 { font-size: 13px; font-weight: 600; flex: 1; }
    .badge {
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
    }
    .marker-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .marker-list::-webkit-scrollbar { width: 4px; }
    .marker-list::-webkit-scrollbar-thumb { background: #2d3148; }

    .marker-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-radius: var(--r);
      margin-bottom: 4px;
      background: #12151f;
      border: 1px solid transparent;
      transition: border-color .15s;
      cursor: pointer;
    }
    .marker-item:hover { border-color: var(--border); }
    .marker-item.active { border-color: var(--accent2); }
    .marker-num {
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .marker-time-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      outline: none;
      cursor: pointer;
    }
    .marker-time-input:focus {
      background: #1e2235;
      border-radius: 4px;
      padding: 0 4px;
      cursor: text;
    }
    .marker-del {
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
    }
    .marker-del:hover { color: var(--red); background: #2d1a1a; }

    .sidebar-foot {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    .output-row {
      display: flex;
      gap: 6px;
    }
    .output-row input {
      flex: 1;
      background: #12151f;
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      padding: 5px 8px;
      font-size: 12px;
      outline: none;
    }
    .output-row input:focus { border-color: var(--accent); }

    /* ── 进度弹窗 ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .overlay.hidden { display: none; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 15px; margin-bottom: 16px; }
    .modal-log {
      background: #0a0c14;
      border-radius: var(--r);
      padding: 10px;
      font-size: 12px;
      font-family: monospace;
      color: #a3e635;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .modal-footer { margin-top: 16px; text-align: right; }
    .overall-bar {
      height: 4px;
      background: #2d3148;
      border-radius: 2px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .overall-fill {
      height: 100%;
      background: var(--green);
      border-radius: 2px;
      transition: width .3s;
    }
  </style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <h1>✂️ 视频切割</h1>
  <button class="btn btn-ghost" id="openFileBtn" onclick="openFilePicker()">📂 打开视频</button>
  <input type="file" id="fileInput" accept="video/*" style="display:none" onchange="loadFile(this)">
  <span class="sep"></span>
  <a href="/" class="btn btn-ghost" style="text-decoration:none">← 返回下载器</a>
</div>

<!-- 主区域 -->
<div class="main">

  <!-- 播放器 -->
  <div class="player-area">
    <div class="video-wrap" id="videoWrap">
      <div class="drop-hint" id="dropHint">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path d="M15.75 10.5l4.72-4.72a.75.75 0 011.28.53v11.38a.75.75 0 01-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 002.25-2.25v-9a2.25 2.25 0 00-2.25-2.25h-9A2.25 2.25 0 002.25 7.5v9a2.25 2.25 0 002.25 2.25z"/>
        </svg>
        <p>点击「打开视频」或将视频拖拽到此处</p>
        <p style="font-size:12px">支持 mp4 / webm / mkv / mov 等格式</p>
      </div>
      <video id="video" tabindex="0"></video>
    </div>

    <!-- 时间轴 -->
    <div class="timeline-area">
      <div class="progress-row">
        <span class="time-label" id="timeLabel">00:00:00.0 / 00:00:00.0</span>
        <div class="progress-wrap" id="progressWrap">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-thumb" id="progressThumb"></div>
          <!-- 标记针由 JS 动态插入 -->
        </div>
      </div>
      <div class="controls-row">
        <button class="btn btn-ghost" onclick="seekDelta(-10)" title="后退10秒">⏮ 10s</button>
        <button class="btn btn-ghost" onclick="seekDelta(-1)" title="后退1秒">◀ 1s</button>
        <button class="btn btn-primary" id="playBtn" onclick="togglePlay()">▶ 播放</button>
        <button class="btn btn-ghost" onclick="seekDelta(1)" title="前进1秒">1s ▶</button>
        <button class="btn btn-ghost" onclick="seekDelta(10)" title="前进10秒">10s ⏭</button>
        <select class="speed-select" onchange="setSpeed(this.value)">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
        <button class="btn btn-yellow" style="background:var(--yellow);color:#000" onclick="addMarker()">📍 打标记</button>
        <span class="kbd-hint">
          <kbd>M</kbd> 打标记 &nbsp;
          <kbd>Space</kbd> 播放/暂停 &nbsp;
          <kbd>←</kbd><kbd>→</kbd> ±0.1s &nbsp;
          <kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd> ±1s
        </span>
      </div>
    </div>
  </div>

  <!-- 右侧标记列表 -->
  <div class="sidebar">
    <div class="sidebar-head">
      <h2>时间标记</h2>
      <span class="badge" id="markerCount">0</span>
      <button class="btn btn-ghost" style="padding:3px 8px;font-size:11px" onclick="clearMarkers()">清空</button>
    </div>
    <div class="marker-list" id="markerList">
      <div style="text-align:center;color:var(--text2);font-size:13px;margin-top:40px">
        播放视频后按 <kbd>M</kbd> 打标记
      </div>
    </div>
    <div class="sidebar-foot">
      <div style="font-size:12px;color:var(--text2)">
        输出目录（留空 = 与视频同目录）
      </div>
      <div class="output-row">
        <input type="text" id="outputDir" placeholder="自动">
      </div>
      <div style="font-size:11px;color:var(--text2)">
        切割方式：按相邻标记之间的时间段切成独立片段
      </div>
      <button class="btn btn-green" onclick="startCut()" id="cutBtn" disabled>✂️ 开始切割</button>
    </div>
  </div>

</div>

<!-- 进度弹窗 -->
<div class="overlay hidden" id="overlay">
  <div class="modal">
    <h3>⚙️ 切割进行中...</h3>
    <div class="overall-bar"><div class="overall-fill" id="overallFill" style="width:0%"></div></div>
    <div class="modal-log" id="modalLog"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
const video    = document.getElementById('video');
const playBtn  = document.getElementById('playBtn');
const timeLabel  = document.getElementById('timeLabel');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressThumb = document.getElementById('progressThumb');
const markerList = document.getElementById('markerList');
const markerCount = document.getElementById('markerCount');
const cutBtn   = document.getElementById('cutBtn');
const dropHint = document.getElementById('dropHint');

let markers = [];       // [{time: float}]
let currentFilePath = '';  // 服务端可访问的真实路径（由后端返回）
let currentFileURL  = '';  // blob URL 用于前端播放
let dragging = false;

// ── 格式化时间 ──────────────────────
function fmt(s, decimals = 1) {
  if (isNaN(s)) return '00:00:00.0';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = (s % 60).toFixed(decimals);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(parseFloat(sec) < 10 ? '0' : '')}${sec}`;
}

function parseTime(str) {
  // 支持 HH:MM:SS.s 或纯秒数
  str = str.trim();
  if (/^\d+(\.\d+)?$/.test(str)) return parseFloat(str);
  const parts = str.split(':');
  if (parts.length === 3) {
    return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
  }
  return NaN;
}

// ── 打开文件 ──────────────────────
function openFilePicker() {
  document.getElementById('fileInput').click();
}

async function loadFile(input) {
  const file = input.files[0];
  if (!file) return;
  await loadFileObj(file);
}

async function loadFileObj(file) {
  // 上传文件路径到后端
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res = await fetch('/api/cutter/open', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.path) {
      currentFilePath = data.path;
    }
  } catch(e) {
    console.warn('后端获取路径失败，切割时会有问题', e);
  }

  // 前端直接用 blob url 播放
  if (currentFileURL) URL.revokeObjectURL(currentFileURL);
  currentFileURL = URL.createObjectURL(file);
  video.src = currentFileURL;
  video.load();
  dropHint.style.display = 'none';
  video.style.display = 'block';
  markers = [];
  renderMarkers();
  cutBtn.disabled = false;
  video.focus();
}

// ── 拖拽支持 ──────────────────────
const wrap = document.getElementById('videoWrap');
wrap.addEventListener('dragover', e => { e.preventDefault(); wrap.style.outline = '2px dashed var(--accent)'; });
wrap.addEventListener('dragleave', () => { wrap.style.outline = ''; });
wrap.addEventListener('drop', e => {
  e.preventDefault();
  wrap.style.outline = '';
  const file = e.dataTransfer.files[0];
  if (file) loadFileObj(file);
});

// ── 播放控制 ──────────────────────
function togglePlay() {
  if (video.paused) { video.play(); playBtn.textContent = '⏸ 暂停'; }
  else              { video.pause(); playBtn.textContent = '▶ 播放'; }
}

function seekDelta(delta) {
  if (!video.src && !currentFileURL) return;
  video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + delta));
}

function setSpeed(v) {
  video.playbackRate = parseFloat(v);
}

// ── 键盘 ──────────────────────────
document.addEventListener('keydown', e => {
  // 如果焦点在输入框里，不拦截
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  switch(e.key) {
    case ' ':
      e.preventDefault();
      togglePlay();
      break;
    case 'ArrowLeft':
      e.preventDefault();
      seekDelta(e.shiftKey ? -1 : -0.1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      seekDelta(e.shiftKey ? 1 : 0.1);
      break;
    case 'm': case 'M':
      e.preventDefault();
      addMarker();
      break;
  }
});

// ── 打标记 ────────────────────────
function addMarker() {
  if (!video.src && !currentFileURL) return;
  const t = video.currentTime;
  markers.push({ time: t });
  markers.sort((a, b) => a.time - b.time);
  renderMarkers();
  renderPins();
}

function clearMarkers() {
  markers = [];
  renderMarkers();
  renderPins();
}

function deleteMarker(idx) {
  markers.splice(idx, 1);
  renderMarkers();
  renderPins();
}

function jumpToMarker(idx) {
  video.currentTime = markers[idx].time;
}

function renderMarkers() {
  markerCount.textContent = markers.length;
  if (markers.length === 0) {
    markerList.innerHTML = '<div style="text-align:center;color:var(--text2);font-size:13px;margin-top:40px">播放视频后按 <kbd>M</kbd> 打标记</div>';
    return;
  }
  markerList.innerHTML = markers.map((m, i) => `
    <div class="marker-item" onclick="jumpToMarker(${i})">
      <div class="marker-num">${i + 1}</div>
      <input class="marker-time-input" value="${fmt(m.time, 3)}"
        onclick="event.stopPropagation()"
        onblur="updateMarkerTime(${i}, this.value)"
        onkeydown="if(event.key==='Enter')this.blur()">
      <button class="marker-del" onclick="event.stopPropagation();deleteMarker(${i})">✕</button>
    </div>
  `).join('');
}

function updateMarkerTime(idx, val) {
  const t = parseTime(val);
  if (!isNaN(t)) {
    markers[idx].time = Math.max(0, Math.min(video.duration || Infinity, t));
    markers.sort((a, b) => a.time - b.time);
    renderMarkers();
    renderPins();
  } else {
    renderMarkers(); // 还原
  }
}

// ── 进度条 ────────────────────────
video.addEventListener('timeupdate', () => {
  const pct = video.duration ? video.currentTime / video.duration * 100 : 0;
  progressFill.style.width = pct + '%';
  progressThumb.style.left = pct + '%';
  timeLabel.textContent = fmt(video.currentTime, 1) + ' / ' + fmt(video.duration, 1);
});

video.addEventListener('ended', () => { playBtn.textContent = '▶ 播放'; });

function progressPosToTime(e) {
  const rect = progressWrap.getBoundingClientRect();
  const x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
  return (x / rect.width) * (video.duration || 0);
}

progressWrap.addEventListener('mousedown', e => {
  dragging = true;
  video.currentTime = progressPosToTime(e);
});
document.addEventListener('mousemove', e => {
  if (!dragging) return;
  video.currentTime = progressPosToTime(e);
});
document.addEventListener('mouseup', () => { dragging = false; });

// ── 标记针渲染 ────────────────────
function renderPins() {
  // 移除旧针
  progressWrap.querySelectorAll('.marker-pin').forEach(p => p.remove());
  if (!video.duration) return;
  markers.forEach(m => {
    const pin = document.createElement('div');
    pin.className = 'marker-pin';
    pin.style.left = (m.time / video.duration * 100) + '%';
    progressWrap.appendChild(pin);
  });
}
video.addEventListener('loadedmetadata', renderPins);

// ── 切割 ──────────────────────────
async function startCut() {
  if (markers.length < 2) {
    alert('至少需要 2 个标记（定义至少 1 段）');
    return;
  }
  if (!currentFilePath) {
    alert('无法获取文件路径，请重新打开视频');
    return;
  }
  const outputDir = document.getElementById('outputDir').value.trim();
  const segments = [];
  for (let i = 0; i < markers.length - 1; i++) {
    segments.push({ start: markers[i].time, end: markers[i + 1].time });
  }

  showModal();
  log('开始切割，共 ' + segments.length + ' 段...\n');

  const res = await fetch('/api/cutter/cut', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ file: currentFilePath, segments, output_dir: outputDir })
  });
  const data = await res.json();
  if (data.task_id) {
    pollCut(data.task_id, segments.length);
  } else {
    log('❌ ' + (data.error || '未知错误'));
  }
}

let logLines = 0;
function log(msg) {
  const el = document.getElementById('modalLog');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
  logLines++;
}

async function pollCut(taskId, total) {
  let done = false;
  while (!done) {
    await new Promise(r => setTimeout(r, 800));
    const res = await fetch('/api/cutter/task/' + taskId);
    const data = await res.json();
    // 更新日志（只显示新行）
    const el = document.getElementById('modalLog');
    const lines = data.logs || [];
    if (lines.length > logLines) {
      for (let i = logLines; i < lines.length; i++) {
        el.textContent += lines[i] + '\n';
      }
      el.scrollTop = el.scrollHeight;
      logLines = lines.length;
    }
    // 进度条
    const pct = total ? Math.round((data.done_count || 0) / total * 100) : 0;
    document.getElementById('overallFill').style.width = pct + '%';

    if (data.status === 'done' || data.status === 'error') {
      done = true;
      document.querySelector('#overlay .modal h3').textContent =
        data.status === 'done' ? '✅ 切割完成！' : '❌ 切割出错';
    }
  }
}

function showModal() {
  logLines = 0;
  document.getElementById('modalLog').textContent = '';
  document.getElementById('overallFill').style.width = '0%';
  document.querySelector('#overlay .modal h3').textContent = '⚙️ 切割进行中...';
  document.getElementById('overlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('overlay').classList.add('hidden');
}
</script>
</body>
</html>
